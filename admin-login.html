<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Hoop Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
</head>
<body class="admin-page" style="padding:16px;display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--navy-deep);margin:0">

<div class="login-card" style="background:#fff;border-radius:16px;padding:40px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
  <div style="font-family:'Bebas Neue';font-size:32px;color:var(--navy);letter-spacing:0.03em;margin-bottom:8px;text-align:center">
    HOOP <span style="color:var(--gold)">CONNECT</span>
  </div>
  <p style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px">Admin sign-in</p>

  <form id="loginForm">
    <div class="admin-field">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username" />
    </div>
    <div class="admin-field">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password" />
    </div>
    <div id="loginError" style="color:#dc2626;font-size:13px;margin:10px 0;display:none"></div>
    <button type="submit" class="admin-btn-primary" style="width:100%;justify-content:center;display:flex" id="loginBtn">Sign in</button>
  </form>

  <p style="font-size:12px;color:var(--muted);text-align:center;margin-top:20px">
    <a href="index.html">← Back to site</a>
  </p>
</div>

<script>
const { createClient } = supabase;
const sb = createClient(HOOP_SUPABASE_URL, HOOP_SUPABASE_ANON_KEY);

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginError');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  err.style.display = 'none';

  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){
    err.textContent = error.message;
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign in';
    return;
  }
  window.location.href = 'admin.html';
});
</script>

</body>
</html>
